<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Карта осознанности</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm column, one question per screen, a staircase result. Colors of the course: violet rising to gold. */
:root{
  --bg:#F6F3FB; --surface:#FFFFFF; --fg:#231D3F; --muted:#6B6488; --line:#E2DAF1;
  --violet:#6E5BC4; --gold:#C38E3A; --sel:#EFEAFB; --trap:#A0405A; --help:#2E7D5B;
  --display:"Prata", Georgia, "Times New Roman", serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15112A; --surface:#201A3A; --fg:#EEEAF8; --muted:#A9A1C8; --line:#352D5A;
  --violet:#A895F2; --gold:#E3B36A; --sel:#2C2452; --trap:#F08AA3; --help:#7FD1A9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15112A; --surface:#201A3A; --fg:#EEEAF8; --muted:#A9A1C8; --line:#352D5A;
  --violet:#A895F2; --gold:#E3B36A; --sel:#2C2452; --trap:#F08AA3; --help:#7FD1A9; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:720px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(30px,6vw,44px)}
h2{font-size:clamp(24px,4.5vw,32px)}
h3{font-size:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.btn{font:inherit;font-weight:600;border:0;border-radius:999px;padding:13px 24px;cursor:pointer;background:var(--violet);color:var(--surface);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--violet);border:1.5px solid var(--line)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
/* intro */
.rail{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--violet),var(--gold));width:120px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fact{border-top:1px solid var(--line);padding-top:10px}
.fact b{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:var(--violet)}
@media (max-width:480px){.facts{grid-template-columns:1fr}}
/* question */
.progress{display:flex;gap:4px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--violet)}
.desc{background:var(--surface);border-radius:14px;padding:16px 18px;color:var(--muted);font-size:15px}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);letter-spacing:.04em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:start;text-align:left;font:inherit;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--violet)}
.opt.sel{background:var(--sel);border-color:var(--violet)}
.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;font-variant-numeric:tabular-nums}
/* result */
.big{font-family:var(--display);font-size:clamp(34px,7vw,52px);line-height:1.1}
.panel{background:var(--surface);border-radius:18px;padding:20px}
.chart{display:block;width:100%;max-width:520px;margin:0 auto;height:auto}
.stairs{display:flex;flex-direction:column;gap:6px}
.stair{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr);gap:12px;align-items:center}
.stair .st{border-radius:10px;padding:8px 12px;color:#fff;font-weight:700;font-size:14px;line-height:1.25}
.stair .st small{display:block;font-weight:400;font-style:italic;opacity:.92;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg)}
.focus{border-left:0;display:grid;gap:10px}
.lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.lab.trap{color:var(--trap)} .lab.help{color:var(--help)}
details{border-top:1px solid var(--line);padding:12px 0}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}
summary .dot{width:12px;height:12px;border-radius:50%;flex:none}
details .stack{padding:10px 0 4px 22px;font-size:15px}
.legend{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--c)}
.note{font-size:13px;color:var(--muted)}
.toast{font-size:13px;color:var(--help);min-height:1.2em}
@media (max-width:480px){.stair{grid-template-columns:120px minmax(0,1fr)}}
.wrap.wide{max-width:1120px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:36px;align-items:start}
.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));max-height:calc(100vh - 32px);overflow:auto;border-radius:18px;background:var(--surface)}
.sideinner{padding:18px 18px 8px}
.side details .stack{padding-left:22px;font-size:14px}
.side summary{align-items:flex-start;line-height:1.3}
.side summary .dot{margin-top:4px}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none}}
.lvcard{background:var(--surface);border-radius:16px;padding:18px 20px;display:grid;gap:12px;border-top:4px solid var(--lc)}
.lvcard header{display:grid;gap:10px}
.sphs{display:flex;flex-wrap:wrap;gap:6px 22px}
.sph{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:clamp(22px,3.6vw,28px);line-height:1.2;color:var(--fg)}
.ico{width:20px;height:20px;flex:none;color:var(--violet)}
.ico.big{width:36px;height:36px;stroke-width:1.8}
.sph .ico{color:var(--lc)}
.qtitle{display:flex;align-items:center;gap:12px}
.lvline{display:flex;align-items:center;gap:10px;font-size:16px;flex-wrap:wrap}
.lvline b{color:var(--lc)}
.lvcard .badge{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.lvcard .motto{font-size:14px;font-style:italic}
.picked{margin:0;padding:10px 14px;list-style:none;background:var(--bg);border-radius:10px;display:grid;gap:6px;font-size:15px}
.lvcard.growth{border:2px solid var(--lc);border-top-width:4px;box-shadow:0 6px 24px color-mix(in srgb, var(--lc) 25%, transparent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<main class="wrap" id="app"></main>

<script>
const DATA = {"spheres": [{"name": "Эмоции и тело", "desc": "Как вы проживаете свои чувства и как относитесь к своему телу. Подумайте: что происходит с вами, когда вы злитесь или тревожитесь? Замечаете ли вы усталость и напряжение заранее — или только когда уже «падаете с ног»?", "items": ["Эмоции захлёстывают, и я не понимаю, что с ними делать. О теле вспоминаю, когда что-то заболит.", "Живу в постоянном напряжении. Злость и стресс — моё топливо, чтобы справляться.", "Понимаю, что эмоциями можно управлять. Ищу способы, пробую разные практики.", "Замечаю свои эмоции, не сливаясь с ними. Слышу сигналы своего тела.", "Эмоции текут легко, я быстро возвращаюсь в равновесие.", "Осознанно управляю вниманием и энергией. Тело — мой союзник.", "Бывают моменты глубокого покоя, когда внутри нет никакой борьбы."]}, {"name": "Любовь к себе", "desc": "Как вы разговариваете с собой и заботитесь о себе. Подумайте: что вы говорите себе после ошибки? Есть ли в вашем дне время только для вас — без чувства вины?", "items": ["Чаще ругаю себя, чем поддерживаю.", "Сначала дела и другие люди — о себе подумаю потом.", "Задаюсь вопросом: а что вообще значит любить себя?", "Отношусь к себе бережно, доверяю своим чувствам, действую больше из любви, чем из страха.", "Умею радовать себя и заботиться о себе без чувства вины.", "Принимаю себя целиком — даже свои тёмные стороны.", "Любовь к себе естественно перетекает в любовь к людям и миру."]}, {"name": "Отношения", "desc": "Близкие, партнёр, семья, друзья, коллеги. Подумайте: чего в ваших отношениях больше — тепла или напряжения? Умеете ли вы говорить о своих чувствах и желаниях?", "items": ["В отношениях много конфликтов, обид и претензий.", "На близких не хватает времени и сил — всё уходит на работу и заботы.", "Ищу настоящую близость, но пока не понимаю, какие отношения мне нужны.", "Умею строить отношения, говорить о своих чувствах и выбирать сердцем.", "Рядом люди, с которыми легко и радостно идти к общим целям.", "Вместе с близкими мы создаём что-то новое: дом, семью, общие проекты.", "Чувствую тепло и связь почти с каждым человеком."]}, {"name": "Ответственность", "desc": "Кто, по-вашему, отвечает за то, что происходит в вашей жизни. Подумайте: когда что-то идёт не так, что вы делаете первым делом — ищете виноватых, вините себя или ищете решение?", "items": ["Чаще всего виноваты обстоятельства и другие люди.", "Беру ответственность, но как тяжёлый груз: всё контролирую и часто виню себя.", "Учусь отвечать за свою жизнь, но ошибки отзываются сильным чувством вины.", "Отвечаю за свои реакции: начинаю менять ситуацию с себя, а не с других.", "Ответственность для меня — это свобода выбора, а не вина.", "Понимаю, что мои решения влияют не только на меня, но и на людей вокруг.", "Действую естественно, без борьбы между «надо» и «хочу»."]}, {"name": "Честность", "desc": "Честность с другими и, что ещё важнее, с собой. Подумайте: часто ли вы делаете вид, что всё хорошо? Легко ли вам признать ошибку или сказать «я не знаю»?", "items": ["Мне проще промолчать или сказать неправду, чем признаться.", "Часто приукрашиваю, чтобы не показать слабость.", "Стараюсь говорить правду, но прячусь за маской «успешного» или «духовного» человека.", "Мне не нужно ничего доказывать — честность получается естественно.", "Легко признаю свои ошибки и слабости: мне нечего скрывать.", "Честность с собой и другими даёт силы: я не трачу энергию на маски.", "Просто есть как есть — без масок и оценок."]}, {"name": "Перемены", "desc": "Как вы встречаете новое: переезд, смену работы, болезнь, неожиданный поворот. Подумайте: перемены для вас — угроза или возможность?", "items": ["Перемены пугают: держусь за привычное, даже если мне в нём плохо.", "Перемены — это угроза, поэтому я стараюсь всё держать под контролем.", "Мне важна стабильность, но понемногу учусь принимать изменения.", "Встречаю перемены спокойно и с интересом, легко отпускаю прошлое.", "Перемены часто начинаются с меня: я легко пробую новое.", "Каждый день — открытие: жизнь кажется удивительно интересной.", "Внутри есть тихая точка покоя, которую не меняют никакие перемены."]}, {"name": "Работа и деньги", "desc": "Важно не то, сколько вы зарабатываете, а как вы относитесь к работе и деньгам. Подумайте: что вы чувствуете, когда думаете о деньгах? Работа даёт вам силы или забирает их?", "items": ["Денег постоянно не хватает, и это вызывает тревогу и безнадёжность.", "Деньги — это тяжёлый труд: работаю много, а расслабиться страшно.", "Хочу работать меньше и зарабатывать больше, но не понимаю, чего хочу на самом деле.", "Работаю не только ради выживания: дело приносит удовлетворение, к деньгам отношусь спокойно.", "Легко нахожу новые идеи и возможности, денежные вопросы решаю без паники.", "Создаю дело или проекты, которые помогают другим людям.", "Помогаю другим раскрыть их таланты и силы."]}, {"name": "Смысл и духовность", "desc": "Что придаёт вашей жизни смысл: вера, ценности, призвание, связь с чем-то большим. Подумайте: есть ли у вас свой ответ на вопрос «зачем я живу?» — и откуда он взялся?", "items": ["Не задумываюсь о смысле — на это нет ни сил, ни времени.", "Живу по правилам, которые мне дали: «так принято», «так положено».", "Ищу ответы на вопросы «кто я?» и «как всё устроено?», изучаю учения, ищу наставника.", "Понимаю, что главное — внутри, и ищу ответы в себе.", "Доверяю жизни и интуиции, чувствую поддержку — Бога, Вселенной, жизни.", "Живу в согласии со своими ценностями: мой опыт стал знанием, а не только верой.", "Переживаю единство со всем живым."]}], "levels": [{"name": "Спящий", "motto": "Живу на автопилоте", "gist": "День похож на день. Решения принимают привычки и чужие ожидания, кажется, что от меня мало что зависит.", "spheres": "Эмоции захлёстывают, тело замечаю, только когда оно болит. К себе отношусь жёстко и критично. В отношениях много обид и претензий. Ответственность лежит на других и на обстоятельствах. Честность: проще промолчать или сказать «всё нормально». Перемены пугают. Деньги — тревога, что не хватит. О смысле жизни думать некогда.", "trap": "«Так живут все». Привычка винить других, государство, судьбу.", "next": "Заметить свой автопилот — это уже первый шаг. Пару раз в день останавливаться и спрашивать себя: «Что я сейчас чувствую?» Начать с 3–5 минут спокойного дыхания в день."}, {"name": "Борец", "motto": "Мир — поле битвы", "gist": "Просыпается воля: хочется вырваться, добиться, изменить. Но всё даётся через усилие, контроль и напряжение.", "spheres": "Напряжение стало топливом, тело работает на износ. Себя — «потом». На близких не хватает времени и сил. Всё тащу на себе и всё контролирую. Держу лицо, приукрашиваю. Перемены — угроза, их надо держать под контролем. Деньги — только тяжёлым трудом. Живу «как положено».", "trap": "Хронический стресс и страх расслабиться: «если отпущу — всё рухнет».", "next": "Разрешить себе отдых без чувства вины. Учиться просить о помощи. Практики расслабления тела, сканирование тела, дыхание."}, {"name": "Искатель", "motto": "Ищу, но пока не меняюсь", "gist": "Появляется интерес к себе: книги, курсы, вопрос «кто я?». Знаний становится много, а жизнь меняется медленно.", "spheres": "Пробую разные практики для эмоций и тела. Задаю вопрос «что значит любить себя?». Ищу настоящей близости. Учусь отвечать за свою жизнь, но много чувства вины. Иногда надеваю маску «успешного» или «духовного» человека. Учусь принимать перемены. Хочу работать иначе, но пока не знаю как. Ищу ответы у учителей и в книгах.", "trap": "Знания вместо практики. Сравнение себя с «более духовными». Ожидание чуда от следующей книги или курса.", "next": "Выбрать одну практику и делать её регулярно, хотя бы 10 минут в день. Не собирать знания, а применять их в обычной жизни."}, {"name": "Наблюдатель", "motto": "Не реагирую — понимаю", "gist": "Между событием и реакцией появляется пауза. Мысли и эмоции видны как бы со стороны — и появляется выбор.", "spheres": "Замечаю чувства, не сливаясь с ними, слышу сигналы тела. К себе отношусь бережно. В отношениях говорю о чувствах, а не коплю их. Отвечаю за свои реакции. Честность даётся без усилий. К переменам — спокойный интерес. Работа в радость. Ответы ищу внутри себя.", "trap": "Холодная отстранённость: «наблюдаю», но не чувствую и не действую. Наблюдение становится способом спрятаться от жизни.", "next": "Соединить наблюдение с сердцем: практики благодарности и любящей доброты (метта). Действовать, опираясь на то, что чувствую."}, {"name": "Сёрфер", "motto": "Ловлю волну", "gist": "Доверие и интуиция. Многое получается легче, жизнь словно подбрасывает нужные встречи и возможности.", "spheres": "Эмоции текут легко и не застревают в теле. Радую себя без чувства вины. В отношениях лёгкость и общие цели. Чувствую свободу выбора. Скрывать нечего. Новое начинается с меня. В работе — поток идей и возможностей. Доверяю жизни.", "trap": "Погоня за лёгкостью. Избегание обязательств, трудных чувств и рутины: «всё должно течь само».", "next": "Заземлиться: глубина вместо скольжения по поверхности. Верность своему делу и людям, доводить начатое до конца."}, {"name": "Архитектор", "motto": "Выбираю, куда направить силы", "gist": "Жизнь строится осознанно, по своим ценностям. Появляется желание создавать то, что полезно другим.", "spheres": "Управляю своим вниманием и состоянием. Принимаю себя целиком — и сильные, и слабые стороны. С близкими мы создаём что-то вместе. Влияю на других личным примером. Живу без масок. Каждый день — открытие. Моё дело служит людям. Живу по своим ценностям.", "trap": "Иллюзия полного контроля, гордыня «я знаю, как надо», выгорание от больших планов.", "next": "Смирение и доверие: отпускать контроль, слушать других людей и саму жизнь. Больше тишины и простого присутствия в медитации."}, {"name": "Творец", "motto": "Я — часть целого", "gist": "Чувство единства с миром и людьми. Чаще это не постоянный уровень, а моменты, знакомые каждому: у моря, рядом с ребёнком, в глубокой медитации.", "spheres": "В теле глубокий покой. Любовь к себе становится любовью к миру. Чувство связи со всеми. Нет борьбы между «надо» и «хочу». Всё есть так, как есть. В любых переменах остаётся точка покоя. Помогаю раскрыться другим. Чувствую единство со всем живым.", "trap": "Пытаться «достичь» этого состояния как цели — ловушка эго. Духовная гордость.", "next": "Просто возвращаться к этому чувству снова и снова и делиться им. Путь не заканчивается: каждый день мы снова делаем первый шаг."}]};
const S = DATA.spheres, L = DATA.levels, N = S.length;
const ICON = {
 "Эмоции и тело": '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/><path d="M6.5 12h3l1.5-2.5 2 5 1.5-2.5h3"/>',
 "Любовь к себе": '<circle cx="12" cy="7" r="3.2"/><path d="M5 20c.8-3.6 3.6-5.6 7-5.6s6.2 2 7 5.6"/><path d="M12 18.6s-2.2-1.3-2.2-2.8a1.1 1.1 0 0 1 2.2-.4 1.1 1.1 0 0 1 2.2.4c0 1.5-2.2 2.8-2.2 2.8z"/>',
 "Отношения": '<circle cx="9" cy="12" r="5.5"/><circle cx="15" cy="12" r="5.5"/>',
 "Ответственность": '<circle cx="12" cy="12" r="8.5"/><path d="M14.8 9.2 13 13l-3.8 1.8L11 11z"/>',
 "Честность": '<path d="M7 4h10l4 5-9 11L3 9z"/><path d="M3 9h18M9.5 4 8 9l4 11 4-11-1.5-5"/>',
 "Перемены": '<path d="M19 8a7.5 7.5 0 0 0-13.4 0"/><path d="M5 16a7.5 7.5 0 0 0 13.4 0"/><path d="M19 3.5V8h-4.5M5 20.5V16h4.5"/>',
 "Работа и деньги": '<ellipse cx="12" cy="7" rx="7" ry="2.8"/><path d="M5 7v5c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V7"/><path d="M5 12v5c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8v-5"/>',
 "Смысл и духовность": '<path d="M12 19c-2.5-2-3.5-5-2.5-9 1 .7 2 1.8 2.5 3 .5-1.2 1.5-2.3 2.5-3 1 4 0 7-2.5 9z"/><path d="M12 19c-3.5 0-6.5-2-7.5-5.5 2 0 4 .6 5.2 2"/><path d="M12 19c3.5 0 6.5-2 7.5-5.5-2 0-4 .6-5.2 2"/><path d="M3 19.5h18"/>',
};
const ico = (name, cls="ico") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]||""}</svg>`;
const KEY = "karta-osoznannosti-v1";
let answers = Array(N).fill(null), step = 0;

function col(i){ // level 0..6 -> violet..gold
  const a=[0x7B,0x68,0xC8], b=[0xD9,0xA2,0x52], t=i/6;
  return "rgb("+a.map((v,k)=>Math.round(v*(1-t)+b[k]*t)).join(",")+")";
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ return null; } }
function save(rec){ try{ localStorage.setItem(KEY, JSON.stringify(rec)); }catch(e){} }
const app = document.getElementById("app");

function render(){
  app.classList.remove("wide");
  if(step===0) intro(); else if(step<=N) question(step-1); else result();
  window.scrollTo({top:0});
}

function intro(){
  const prev = load();
  app.innerHTML = `
  <div class="stack" style="gap:22px">
    <span class="eyebrow">Алхимия сознания · Блок 1</span>
    <h1>Карта осознанности</h1>
    <div class="rail"></div>
    <p>Этот тест помогает увидеть, где вы сейчас находитесь в восьми сферах жизни. Это условная карта для самонаблюдения, а не научная шкала и не оценка. Хороших и плохих ответов здесь нет.</p>
    <p>В каждой сфере вы увидите семь утверждений. Они идут по порядку: от жизни на автопилоте к ощущению единства с миром. Выберите то, что ближе всего к вам <b>сейчас</b>, а не к тому, какими хочется быть.</p>
    <div class="facts">
      <div class="fact"><b>8</b><span class="muted">сфер жизни</span></div>
      <div class="fact"><b>7</b><span class="muted">утверждений в каждой</span></div>
      <div class="fact"><b>10–15</b><span class="muted">минут</span></div>
    </div>
    <div class="row">
      <button class="btn" id="go">Начать</button>
      ${prev ? `<button class="btn ghost" id="last">Мой прошлый результат</button>` : ""}
    </div>
    ${prev ? `<p class="note">Прошлый результат от ${esc(prev.date)} сохранён в этом браузере. Пройдите тест снова, и мы покажем оба результата на одной диаграмме.</p>` : ""}
  </div>`;
  document.getElementById("go").onclick = () => { step = 1; render(); };
  const l = document.getElementById("last");
  if(l) l.onclick = () => { answers = prev.answers.slice(); step = N+1; result(true); };
}

function question(i){
  const s = S[i];
  app.innerHTML = `
  <div class="stack" style="gap:20px">
    <div class="progress">${S.map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div>
    <span class="eyebrow">Сфера ${i+1} из ${N}</span>
    <h2 class="qtitle">${ico(s.name,"ico big")}${esc(s.name)}</h2>
    <p class="desc">${esc(s.desc)}</p>
    <div class="scale"><span>↓ от автопилота</span><span>к единству ↓</span></div>
    <div class="opts">
      ${s.items.map((t,k)=>`<button class="opt ${answers[i]===k?"sel":""}" data-k="${k}" id="opt${i}_${k}">
        <span class="num" style="background:${col(k)}">${k+1}</span><span>${esc(t)}</span></button>`).join("")}
    </div>
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost" id="back">← Назад</button>
      ${answers[i]!==null ? `<button class="btn" id="fwd">${i===N-1?"Мой результат":"Дальше →"}</button>` : ""}
    </div>
  </div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    answers[i] = +b.dataset.k;
    app.querySelectorAll(".opt").forEach(x => x.classList.toggle("sel", x===b));
    setTimeout(() => { step = i+2; render(); }, 280);
  });
  document.getElementById("back").onclick = () => { step = i; render(); };
  const f = document.getElementById("fwd"); if(f) f.onclick = () => { step = i+2; render(); };
}

function radar(cur, prev){
  const cx=230, cy=210, R=150, ang=k=>-Math.PI/2 + k*2*Math.PI/N;
  const pt=(k,v)=>[cx+R*(v/7)*Math.cos(ang(k)), cy+R*(v/7)*Math.sin(ang(k))];
  let g="";
  for(let r=1;r<=7;r++){
    const p=S.map((_,k)=>pt(k,r).map(x=>x.toFixed(1)).join(",")).join(" ");
    g+=`<polygon points="${p}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  }
  S.forEach((s,k)=>{
    const [x,y]=pt(k,7); g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;
    const [lx,ly]=pt(k,8.15); const anchor=Math.abs(lx-cx)<8?"middle":(lx>cx?"start":"end");
    const parts=s.name.split(" и ");
    const lines=parts.length>1?[parts[0]+" и",parts[1]]:[s.name];
    const y0=ly-(lines.length-1)*8+4;
    g+=`<text x="${lx}" y="${y0}" text-anchor="${anchor}" font-size="12.5" fill="var(--muted)" font-family="Manrope, sans-serif">${lines.map((t,j)=>`<tspan x="${lx}" dy="${j?16:0}">${esc(t)}</tspan>`).join("")}</text>`;
  });
  for(let r=1;r<=7;r++){ const [x,y]=pt(0,r); g+=`<text x="${x+5}" y="${y+4}" font-size="10" fill="var(--muted)" font-family="Manrope, sans-serif">${r}</text>`; }
  const poly=(a,stroke,fill,dash)=>`<polygon points="${a.map((v,k)=>pt(k,v+1).map(x=>x.toFixed(1)).join(",")).join(" ")}" fill="${fill}" stroke="${stroke}" stroke-width="2.5" ${dash?'stroke-dasharray="6 5"':''} stroke-linejoin="round"/>`;
  if(prev) g+=poly(prev,"var(--muted)","none",true);
  g+=poly(cur,"var(--violet)","color-mix(in srgb, var(--violet) 22%, transparent)");
  cur.forEach((v,k)=>{ const [x,y]=pt(k,v+1); g+=`<circle cx="${x}" cy="${y}" r="5" fill="${col(v)}" stroke="var(--surface)" stroke-width="2"/>`; });
  return `<svg class="chart" viewBox="-50 0 560 420" role="img" aria-label="Диаграмма уровней по сферам">${g}</svg>`;
}

function result(fromSaved){
  const prevRec = load();
  const today = new Date().toLocaleDateString("ru-RU");
  let prev = null;
  if(!fromSaved){
    if(prevRec && prevRec.answers.join()!==answers.join()) prev = prevRec;
    save({answers:answers.slice(), date:today});
  }
  const avg = answers.reduce((a,b)=>a+b+1,0)/N;
  const avgLvl = Math.round(avg)-1;
  const min = Math.min(...answers);
  // groups by level, from highest to lowest
  const groups = [];
  for(let lv=6; lv>=0; lv--){ const ks = S.map((_,k)=>k).filter(k=>answers[k]===lv); if(ks.length) groups.push({lv, ks}); }
  const growth = groups[groups.length-1], upper = groups.slice(0,-1);
  const card = (g, isGrowth) => {
    const l = L[g.lv];
    return `<article class="lvcard ${isGrowth?"growth":""}" style="--lc:${col(g.lv)}">
      <header>
        <div class="sphs">${g.ks.map(k=>`<div class="sph">${ico(S[k].name,"ico big")}<span>${esc(S[k].name)}</span></div>`).join("")}</div>
        <div class="lvline"><span class="badge" style="background:${col(g.lv)}">${g.lv+1}</span><span>вы <b>${esc(l.name)}</b> <span class="muted motto">«${esc(l.motto)}»</span></span></div>
      </header>
      <ul class="picked">${g.ks.map(k=>`<li><span class="muted">${g.ks.length>1?esc(S[k].name)+": ":"Ваш ответ: "}</span>${esc(S[k].items[g.lv])}</li>`).join("")}</ul>
      <p>${esc(l.gist)}</p>
      <div><span class="lab trap">Ловушка уровня</span><p>${esc(l.trap)}</p></div>
      <div><span class="lab help">Что помогает идти дальше</span><p>${esc(l.next)}</p></div>
    </article>`;
  };
  app.classList.add("wide");
  app.innerHTML = `
  <div class="layout">
   <div class="main stack" style="gap:26px">
    <span class="eyebrow">Ваша карта · ${fromSaved?esc(prevRec.date):today}</span>
    <div class="stack" style="gap:6px">
      <span class="muted">Средний уровень ${avg.toFixed(1).replace(".",",")} из 7</span>
      <div class="big" style="color:${col(avgLvl)}">${esc(L[avgLvl].name)}</div>
      <p class="muted"><i>«${esc(L[avgLvl].motto)}»</i></p>
    </div>
    <div class="panel stack">
      ${radar(answers, prev && prev.answers)}
      ${prev ? `<div class="legend"><span style="--c:var(--violet)">Сейчас</span><span style="--c:var(--muted)">${esc(prev.date)}</span></div>` : ""}
    </div>
    <p>Почти у всех диаграмма неровная, и это нормально: разные сферы жизни находятся на разных ступенях. Ниже ваши сферы — от самой высокой ступени к самой низкой.</p>
    ${upper.length ? `<div class="stack" style="gap:14px">${upper.map(g=>card(g,false)).join("")}</div>` : ""}
    <div class="stack" style="gap:10px">
      <h2>Точка роста</h2>
      <p class="muted">Здесь ваша самая низкая ступень. Это не приговор, а подсказка, куда направить внимание на этом курсе.</p>
      ${card(growth,true)}
    </div>
    <div class="panel stack">
      <h3>Сохраните результат</h3>
      <p>В последнем блоке курса мы пройдём тест ещё раз и сравним. Результат запомнится в этом браузере, но надёжнее сделать скриншот или скопировать результат и отправить себе.</p>
      <div class="row">
        <button class="btn" id="copy">Скопировать результат</button>
        <button class="btn ghost" id="again">Пройти заново</button>
      </div>
      <div class="toast" id="toast" aria-live="polite"></div>
      <textarea id="ctext" readonly hidden rows="10" style="width:100%;font:inherit;font-size:14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:10px"></textarea>
    </div>
    <p class="note">Уровни — метафора и карта для самонаблюдения, а не научная классификация и не оценка человека. Каждый уровень — нормальный этап пути. Уровень Творца — это скорее моменты, знакомые каждому, чем постоянное состояние.</p>
   </div>
   <aside class="side">
    <div class="sideinner">
      <span class="eyebrow">Справочник</span>
      <h3 style="margin:4px 0 10px">Семь уровней</h3>
      ${L.map((l,lv)=>lv).reverse().map(lv=>{ const l=L[lv]; return `<details>
        <summary><span class="dot" style="background:${col(lv)}"></span><span>${lv+1}. ${esc(l.name)}<br><span class="muted" style="font-weight:400;font-size:13px"><i>«${esc(l.motto)}»</i></span></span></summary>
        <div class="stack">
          <p>${esc(l.gist)}</p>
          <div><span class="lab" style="color:var(--violet)">Сферы жизни</span><p>${esc(l.spheres)}</p></div>
          <div><span class="lab trap">Ловушка</span><p>${esc(l.trap)}</p></div>
          <div><span class="lab help">Что помогает идти дальше</span><p>${esc(l.next)}</p></div>
        </div></details>`; }).join("")}
    </div>
   </aside>
  </div>`;
  const text = `Карта осознанности, ${fromSaved?prevRec.date:today}\nСредний уровень: ${avg.toFixed(1)} — ${L[avgLvl].name}\n` + S.map((s,k)=>`${s.name}: ${answers[k]+1} — ${L[answers[k]].name}`).join("\n");
  document.getElementById("copy").onclick = async () => {
    const t = document.getElementById("toast"), ta = document.getElementById("ctext");
    try { await navigator.clipboard.writeText(text); t.textContent = "Скопировано. Вставьте в заметки или отправьте себе в мессенджер."; }
    catch(e){ ta.value = text; ta.hidden = false; ta.select(); t.textContent = "Выделите текст ниже и скопируйте его."; }
  };
  document.getElementById("again").onclick = () => { answers = Array(N).fill(null); step = 1; render(); };
}
render();
</script>
